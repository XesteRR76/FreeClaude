<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <linearGradient id="geminiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)" filter="url(#shadow)" />

  <!-- Inner Terminal Canvas -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="#18181B" opacity="0.95" />

  <!-- Terminal Top Bar Dots -->
  <circle cx="116" cy="116" r="10" fill="#EF4444" />
  <circle cx="146" cy="116" r="10" fill="#F59E0B" />
  <circle cx="176" cy="116" r="10" fill="#10B981" />

  <!-- Code Command Prompt Symbol '>_' -->
  <path d="M 130 180 L 195 240 L 130 300" fill="none" stroke="#F97316" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="220" y1="300" x2="280" y2="300" stroke="#F97316" stroke-width="18" stroke-linecap="round" />

  <!-- Gemini AI Sparkle / Star in bottom right -->
  <path d="M 370 270 Q 370 320 410 320 Q 370 320 370 370 Q 370 320 330 320 Q 370 320 370 270 Z" fill="url(#geminiGlow)" />
  <circle cx="370" cy="320" r="6" fill="#FFFFFF" />
</svg>
